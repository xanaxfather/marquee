<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Choose Artwork</title>
<meta name="description" content="Choose the artwork Marquee shows on your Discord profile for this title.">
<style>
/* Hallmark · shape: app screen · genre: atmospheric · theme: brand · redesign: full
 * paper: oklch(16.5% 0.012 274) · accent: oklch(54.5% 0.2 274) · display: ui-serif (New York) · body: system-ui (SF Pro, Segoe UI Variable)
 * nav: kept, tabs as an underlined strip with counts · signature: the Discord card on a dark stage, showing the artwork as it will land · states: loading, empty, error, full
 * axes: dark/roman-serif/chromatic-blurple · posture: settled · contrast: pass · v2.0.0 */
/* Hallmark · pre-emit critique: P4 H4 E4 S4 R5 V5 · weakest: S, the left side is a poster wall like any image picker; let the posters carry it, dropped the glow wash, and set the title in the serif so the picker reads like a title card */
:root {
  --space-3xs: 2px; --space-2xs: 4px; --space-xs: 8px; --space-sm: 12px; --space-md: 16px; --space-lg: 24px; --space-xl: 40px; --space-2xl: 64px;
  --text-2xs: 0.6875rem; --text-xs: 0.75rem; --text-sm: 0.8125rem; --text-md: 0.875rem; --text-lg: 1rem; --text-xl: 1.25rem; --text-2xl: 1.75rem; --text-3xl: 2.25rem;
  --ease-out: cubic-bezier(0.16, 1, 0.3, 1);
  --dur-micro: 120ms; --dur-short: 220ms;
  --z-raised: 10; --z-modal: 400;

  --color-paper: oklch(16.5% 0.012 274);
  --color-paper-2: oklch(19.5% 0.014 274);
  --color-paper-3: oklch(23.5% 0.016 274);
  --color-paper-4: oklch(28% 0.018 274);
  --color-well: oklch(13.5% 0.01 274);
  --color-ink: oklch(95.5% 0.006 274);
  --color-ink-2: oklch(80% 0.012 274);
  --color-muted: oklch(66% 0.016 274);
  --color-rule: oklch(100% 0 0 / 0.075);
  --color-rule-strong: oklch(100% 0 0 / 0.14);
  --color-accent: oklch(54.5% 0.2 274);
  --color-accent-hi: oklch(50% 0.2 274);
  --color-rule-hover: oklch(100% 0 0 / 0.22);
  --color-paper-5: oklch(32% 0.02 274);
  --color-chip: oklch(12% 0.01 274 / 0.84);
  --shadow-seg: 0 1px 2px oklch(5% 0.01 274 / 0.4);
  --shadow-tile: 0 10px 24px oklch(5% 0.01 274 / 0.5);
  --color-accent-soft: oklch(58.5% 0.2 274 / 0.18);
  --color-accent-text: oklch(78% 0.12 274);
  --color-accent-ink: oklch(99% 0.004 274);
  --color-focus: oklch(76% 0.14 274);
  --color-success: oklch(72% 0.16 152);
  --color-warn: oklch(81% 0.14 80);
  --color-error: oklch(70% 0.17 24);
  --color-error-soft: oklch(70% 0.17 24 / 0.14);
  --color-scrim: oklch(10% 0.01 274 / 0.72);
  --color-discord: oklch(24.5% 0.008 270);
  --color-discord-line: oklch(100% 0 0 / 0.06);
  --color-discord-time: oklch(72% 0.16 152);

  --font-display: "New York", ui-serif, Georgia, serif;
  --font-body: -apple-system, BlinkMacSystemFont, "SF Pro Text", "Segoe UI Variable Text", "Segoe UI", system-ui, sans-serif;
  --font-mono: ui-monospace, "SF Mono", "Cascadia Mono", Consolas, monospace;

  --radius-control: 7px; --radius-group: 11px; --radius-pill: 999px;
  --shadow-lift: 0 1px 0 oklch(100% 0 0 / 0.05) inset, 0 8px 24px oklch(5% 0.01 274 / 0.45);
  --shadow-modal: 0 24px 80px oklch(5% 0.01 274 / 0.6);
  color-scheme: dark;
}
.windows {
  --font-display: "Segoe UI Variable Display", "Segoe UI", system-ui, sans-serif;
  --radius-control: 5px; --radius-group: 8px;
}

*, *::before, *::after { box-sizing: border-box; }
html, body { overflow-x: clip; height: 100%; }
body {
  margin: 0; overflow-y: hidden; background: var(--color-paper); color: var(--color-ink);
  font: var(--text-md)/1.45 var(--font-body); -webkit-font-smoothing: antialiased;
  user-select: none; -webkit-user-select: none; cursor: default; caret-color: var(--color-accent);
}
::selection { background: var(--color-accent-soft); color: var(--color-ink); }
:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }
button, input { font: inherit; color: inherit; }
::-webkit-scrollbar { width: 10px; }
::-webkit-scrollbar-thumb { background: var(--color-paper-4); border-radius: var(--radius-pill); border: 3px solid var(--color-paper); }
::-webkit-scrollbar-track { background: transparent; }

.app { display: grid; grid-template-columns: minmax(0, 1fr) 348px; grid-template-rows: minmax(0, 1fr); height: 100vh; }

/* ---------- left: the library ---------- */
main { display: flex; flex-direction: column; min-width: 0; min-height: 0; }
header { padding: 48px 32px 0; border-bottom: 1px solid var(--color-rule); }
.title {
  margin: 0; max-width: 28ch; font-family: var(--font-display); font-weight: 500;
  font-size: var(--text-3xl); line-height: 1.08; letter-spacing: -0.015em;
  overflow-wrap: break-word; min-width: 0; text-wrap: balance;
}
.windows .title { font-weight: 600; font-size: var(--text-2xl); letter-spacing: -0.01em; }
.subtitle { margin-top: var(--space-2xs); color: var(--color-muted); }
.subtitle:empty { display: none; }
.tabs { position: relative; display: flex; gap: var(--space-lg); margin-top: 20px; overflow-x: auto; scrollbar-width: none; }
.tabs::-webkit-scrollbar { display: none; }
.tab {
  position: relative; display: inline-flex; align-items: baseline; gap: var(--space-xs); flex: none;
  min-height: 40px; padding: 0; border: 0; background: transparent; color: var(--color-muted);
  font-weight: 550; cursor: pointer; transition: color var(--dur-micro) var(--ease-out);
}
/* One underline for the whole strip: it slides from the old tab to the new one (left edge + width as a transform). */
.tabmark {
  position: absolute; left: 0; bottom: 0; width: 100px; height: 2px; border-radius: 2px; pointer-events: none;
  background: var(--color-accent); transform-origin: 0 0; opacity: 0;
  transition: transform var(--dur-short) var(--ease-out);
}
.tabmark.ready { opacity: 1; }
.tab:hover { color: var(--color-ink-2); }
.tab:active { color: var(--color-ink); }
.tab.on { color: var(--color-ink); }
.tab .n { color: var(--color-muted); font-size: var(--text-xs); font-variant-numeric: tabular-nums; }
.tab.on .n { color: var(--color-accent-text); }
.tab:focus-visible { outline-offset: 4px; border-radius: 4px; }
.tab.skel { align-self: center; border-radius: var(--radius-control); }

.scroller { flex: 1; min-height: 0; overflow-y: auto; overscroll-behavior: contain; padding: var(--space-lg) 32px var(--space-xl); }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(var(--min, 220px), 100%), 1fr)); gap: var(--space-md); }
.tile {
  position: relative; aspect-ratio: var(--aspect, 16/9); border-radius: 8px; overflow: hidden;
  background: var(--color-paper-3); cursor: pointer; outline: none;
  box-shadow: 0 0 0 1px var(--color-rule);
  transition: transform var(--dur-short) var(--ease-out), box-shadow var(--dur-micro) var(--ease-out);
}
.tile img { width: 100%; height: 100%; object-fit: cover; display: block; }
/* Covers develop in as they arrive (script); hidden only while scripting runs, so they show without it. */
.js .tile img:not(.ok) { opacity: 0; }
@media (hover: hover) and (pointer: fine) {
  .tile:hover { transform: translateY(-2px); box-shadow: 0 0 0 1px var(--color-rule-strong), var(--shadow-tile); }
}
.tile:active { transform: translateY(0) scale(0.97); transition-duration: var(--dur-micro); }
.tile:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 4px; }
/* Selection: the ring closes in onto the cover from just outside its edge. */
.tile::after {
  content: ""; position: absolute; inset: 0; border-radius: inherit; pointer-events: none;
  box-shadow: inset 0 0 0 3px var(--color-accent), inset 0 0 0 5px var(--color-paper);
  opacity: 0; transform: scale(1.06);
  transition: opacity var(--dur-micro) var(--ease-out), transform var(--dur-short) var(--ease-out);
}
.tile.sel::after { opacity: 1; transform: none; }
.chip {
  position: absolute; left: 8px; bottom: 8px; padding: var(--space-3xs) var(--space-xs); border-radius: 5px;
  background: var(--color-chip); color: var(--color-ink); font-size: var(--text-2xs); font-weight: 600; line-height: 18px;
}
.chip.use { left: auto; right: 8px; background: var(--color-accent); color: var(--color-accent-ink); transform-origin: 100% 100%; }
.check {
  position: absolute; top: 8px; right: 8px; display: grid; place-items: center; width: 22px; height: 22px; border-radius: 50%;
  background: var(--color-accent); color: var(--color-accent-ink);
  display: none;
  transition: opacity var(--dur-micro) var(--ease-out), transform var(--dur-short) var(--ease-out);
}
.tile.sel .check { display: grid; }
@starting-style { .tile.sel .check { opacity: 0; transform: scale(0.9); } }
/* A rejected image link shakes once (WAAPI in the script, so it replays on every bad submit). */
.skel {
  background: linear-gradient(100deg, var(--color-paper-3) 30%, var(--color-paper-4) 50%, var(--color-paper-3) 70%);
  background-size: 300% 100%; animation: sh 1.4s ease-in-out infinite;
}
@keyframes sh { from { background-position: 100% 0; } to { background-position: 0 0; } }
.empty { display: flex; flex-direction: column; gap: var(--space-2xs); padding: var(--space-2xl) var(--space-lg); color: var(--color-muted); text-align: center; }
.empty b { color: var(--color-ink); font-family: var(--font-display); font-weight: 500; font-size: var(--text-xl); }

/* ---------- right: the stage ---------- */
aside {
  display: flex; flex-direction: column; gap: var(--space-lg); min-height: 0; overflow-y: auto;
  padding: 48px var(--space-lg) var(--space-lg); background: var(--color-well); border-left: 1px solid var(--color-rule);
}
.label { display: flex; align-items: baseline; justify-content: space-between; gap: var(--space-xs); margin-bottom: var(--space-sm); color: var(--color-ink-2); font-size: var(--text-sm); font-weight: 550; }
.label a { color: var(--color-accent-text); font-weight: 500; text-decoration: underline; text-decoration-color: var(--color-accent-soft); text-underline-offset: 0.18em; cursor: pointer; }
.label a:hover { text-decoration-color: currentColor; }

.dcard {
  padding: var(--space-sm) var(--space-sm) var(--space-sm); border-radius: 10px; background: var(--color-discord);
  color: var(--color-ink); border: 1px solid var(--color-discord-line);
}
.dcard .head { margin-bottom: var(--space-sm); font-size: var(--text-sm); font-weight: 650; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.dcard .row { display: flex; gap: var(--space-sm); align-items: center; }
.dimg { flex: none; width: 84px; height: 84px; border-radius: 9px; overflow: hidden; background: var(--color-paper-3); }
.dimg img { width: 100%; height: 100%; object-fit: cover; display: block; transition: opacity var(--dur-short) var(--ease-out); }
.dimg img.fade { opacity: 0.3; }
.dtext { min-width: 0; display: flex; flex-direction: column; gap: var(--space-3xs); }
.dtext .d { font-weight: 650; overflow-wrap: anywhere; }
.dtext .s { color: var(--color-ink-2); font-size: var(--text-sm); display: -webkit-box; -webkit-line-clamp: 2; -webkit-box-orient: vertical; overflow: hidden; }
.dtext .s:empty { display: none; }
.dtext .t { display: flex; align-items: center; gap: var(--space-xs); margin-top: var(--space-3xs); color: var(--color-discord-time); font: 600 var(--text-sm) var(--font-mono); font-variant-numeric: tabular-nums; }
.hint { margin-top: var(--space-sm); color: var(--color-muted); font-size: var(--text-xs); }

.seg {
  display: flex; gap: var(--space-3xs); padding: var(--space-2xs);
  border-radius: calc(var(--radius-control) + 3px); background: var(--color-paper); border: 1px solid var(--color-rule);
}
.seg button {
  position: relative; flex: 1 1 auto; min-height: 30px; padding: 0 var(--space-xs); border: 0; border-radius: var(--radius-control);
  background: transparent; color: var(--color-muted); font-size: var(--text-sm); font-weight: 550; cursor: pointer;
  white-space: nowrap;
  transition: background-color var(--dur-micro) var(--ease-out), color var(--dur-micro) var(--ease-out), transform var(--dur-micro) var(--ease-out);
}
.seg button:hover { color: var(--color-ink); }
.seg button:active { background: var(--color-paper-3); transform: scale(0.96); }
.seg button.on { background: var(--color-paper-4); color: var(--color-ink); box-shadow: var(--shadow-seg); }
.seg button .dot { position: absolute; left: 35%; right: 35%; bottom: 3px; height: 2px; border-radius: 2px; background: var(--color-accent-text); }

.url { display: flex; gap: var(--space-xs); }
.url input {
  flex: 1; min-width: 0; min-height: 32px; padding: var(--space-xs) var(--space-sm); border: 1px solid var(--color-rule-strong); border-radius: var(--radius-control);
  background: var(--color-paper); color: var(--color-ink); outline: none; user-select: text; -webkit-user-select: text;
  transition: border-color var(--dur-micro) var(--ease-out);
}
.url input::placeholder { color: var(--color-muted); opacity: 0.75; }
.url input:hover { border-color: var(--color-rule-hover); }
.url input:focus-visible { outline: 2px solid var(--color-focus); outline-offset: -1px; }
.url input.bad { border-color: var(--color-error); background-color: var(--color-error-soft); }

.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: var(--space-xs);
  min-height: 32px; padding: 0 var(--space-sm); border: 1px solid var(--color-rule-strong); border-radius: var(--radius-control);
  background: var(--color-paper-3); color: var(--color-ink); font-weight: 550; white-space: nowrap; cursor: pointer;
  transition: background-color var(--dur-micro) var(--ease-out), color var(--dur-micro) var(--ease-out), transform var(--dur-micro) var(--ease-out), opacity var(--dur-micro) var(--ease-out);
}
.btn:hover { background: var(--color-paper-4); }
.btn:active { transform: scale(0.97); }
.btn:disabled, .btn:disabled:hover { background: var(--color-paper-2); border-color: var(--color-rule); color: var(--color-muted); cursor: not-allowed; transform: none; }
.btn.small { padding: 0 var(--space-sm); }
.btn.primary { min-height: 40px; background: var(--color-accent); border-color: transparent; color: var(--color-accent-ink); font-size: var(--text-lg); }
.btn.primary:hover { background: var(--color-accent-hi); }
.spacer { flex: 1; }
.btn.primary:disabled, .btn.primary:disabled:hover { background: var(--color-paper-3); border-color: transparent; color: var(--color-muted); }

/* The action block says what Apply will do: which cover, for which scope, and whether custom art is already set. */
.actions { display: grid; gap: var(--space-sm); padding: var(--space-sm); border: 1px solid var(--color-rule); border-radius: var(--radius-group); background: var(--color-paper-2); }
.act-what { display: flex; align-items: center; gap: var(--space-sm); min-width: 0; }
.act-thumb { flex: none; width: 44px; height: 44px; border-radius: 6px; overflow: hidden; background: var(--color-paper-4); box-shadow: 0 0 0 1px var(--color-rule); }
.act-thumb img { width: 100%; height: 100%; object-fit: cover; display: block; }
.act-thumb img:not([src]) { display: none; }
.act-txt { display: grid; gap: var(--space-3xs); min-width: 0; }
.act-txt b { font-weight: 600; color: var(--color-ink); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.act-txt small { color: var(--color-muted); font-size: var(--text-xs); }
.actions .btn.primary { width: 100%; }
.act-foot { display: flex; align-items: center; justify-content: space-between; gap: var(--space-xs); min-height: 24px; color: var(--color-muted); font-size: var(--text-xs); }
.act-foot > span { min-width: 0; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
.act-foot .dot { display: inline-block; width: 6px; height: 6px; margin-right: var(--space-xs); border-radius: 50%; background: var(--color-accent-text); vertical-align: 1px; }
.act-reset {
  flex: none; white-space: nowrap; padding: var(--space-3xs) var(--space-xs); margin-right: calc(var(--space-xs) * -1); border: 0; border-radius: 5px;
  background: transparent; color: var(--color-ink-2); font: inherit; font-weight: 550; cursor: pointer;
  transition: color var(--dur-micro) var(--ease-out), background-color var(--dur-micro) var(--ease-out), transform var(--dur-micro) var(--ease-out);
}
@media (hover: hover) and (pointer: fine) { .act-reset:hover { color: var(--color-ink); background: var(--color-paper-4); } }
.act-reset:active { transform: scale(0.96); }
.act-reset:focus-visible { outline: 2px solid var(--color-focus); outline-offset: 2px; }
.act-reset[hidden] { display: none; }

/* ---------- toast ---------- */
.toast {
  position: fixed; left: 50%; bottom: 24px; z-index: var(--z-modal); display: flex; align-items: center; gap: var(--space-xs);
  padding: var(--space-xs) var(--space-md) var(--space-xs) var(--space-sm); border-radius: var(--radius-pill); background: linear-gradient(var(--color-accent-soft), var(--color-accent-soft)), var(--color-paper-3); color: var(--color-ink);
  font-weight: 600; box-shadow: 0 0 0 1px var(--color-accent-soft), var(--shadow-modal); pointer-events: none;
  opacity: 0; transform: translate(-50%, 10px); transition: opacity var(--dur-short) var(--ease-out), transform var(--dur-short) var(--ease-out);
}
.toast svg { color: var(--color-accent); }
.toast.show { opacity: 1; transform: translate(-50%, 0); }

/* ---------- platform ---------- */
.windows header { padding-top: 28px; }
.windows aside { padding-top: 28px; }

@media (max-width: 760px) {
  .app { grid-template-columns: minmax(0, 1fr) 300px; }
  header, .scroller { padding-inline: 20px; }
}
@media (prefers-reduced-motion: reduce) {
  *, *::before, *::after { animation-duration: 0.01ms !important; transition-duration: 0.01ms !important; }
  .tile:hover { transform: none; }
}
.dcard .head { display: flex; justify-content: space-between; gap: var(--space-xs); }
.dcard .head span:first-child { min-width: 0; overflow: hidden; text-overflow: ellipsis; }
.dcard .head span:last-child { color: var(--color-muted); }
.toast .tick { stroke: var(--color-accent-ink); }
</style>
</head>
<body>
<div class="app">
  <main>
    <header id="drag">
      <h1 class="title" id="title"></h1>
      <div class="subtitle" id="subtitle"></div>
      <div class="tabs" id="tabs"></div>
    </header>
    <div class="scroller" id="scroller"><div class="grid" id="grid"></div></div>
  </main>

  <aside id="aside">
    <div>
      <div class="label"><span>Discord preview</span><a href="#" id="tmdb">Open on TMDB</a></div>
      <div class="dcard">
        <div class="head"><span id="app"></span><span>•••</span></div>
        <div class="row">
          <div class="dimg"><img id="pimg" alt=""></div>
          <div class="dtext">
            <div class="d" id="pd"></div>
            <div class="s" id="ps"></div>
            <div class="t" id="pt">
              <svg aria-hidden="true" width="15" height="12" viewBox="0 0 15 12" fill="currentColor"><rect x="0" y="0" width="15" height="9.5" rx="2"/><rect x="4" y="10.5" width="7" height="1.5" rx=".75"/></svg>
              <span id="ptime"></span>
            </div>
          </div>
        </div>
      </div>
      <div class="hint">Discord crops artwork to a square.</div>
    </div>

    <div id="scopeBox">
      <div class="label"><span>Use this artwork for</span></div>
      <div class="seg" id="scope"></div>
    </div>

    <div>
      <div class="label"><span>Or use your own image</span></div>
      <div class="url">
        <input id="url" placeholder="https://…" spellcheck="false" autocomplete="off">
        <button class="btn small" id="useUrl">Preview</button>
      </div>
    </div>

    <div class="spacer"></div>
    <div class="actions">
      <div class="act-what">
        <div class="act-thumb"><img id="actImg" alt=""></div>
        <div class="act-txt"><b id="actTitle">No cover selected</b><small id="actSub">Pick one on the left, or paste a link</small></div>
      </div>
      <button class="btn primary" id="apply" disabled>Apply</button>
      <div class="act-foot"><span id="actState">Using TMDB’s artwork</span><button class="act-reset" id="reset" hidden>Reset to default</button></div>
    </div>
  </aside>
</div>
<div class="toast" id="toast"><svg aria-hidden="true" width="16" height="16" viewBox="0 0 16 16"><circle cx="8" cy="8" r="8" fill="currentColor"/><path class="tick" d="M4.5 8.3l2.2 2.2 4.8-4.8" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg><span id="toastText"></span></div>

<script>
const CTX = /*__CTX__*/null;
document.documentElement.classList.add(CTX.platform || "macos");
const $ = id => document.getElementById(id);
const post = m => window.ipc.postMessage(JSON.stringify(m));
const isEpisode = CTX.kind === "Episode" && CTX.season != null && CTX.episode != null;

let groups = null, tab = 0, selected = null;
let applied = Object.assign({}, CTX.overrides);   // scope -> url
let scope = isEpisode ? "episode" : "show";
let inUse = CTX.current;

// ---- header & preview text
$("title").textContent = CTX.details;
$("subtitle").textContent = CTX.state;
$("app").textContent = "Watching " + CTX.app_name;
$("pd").textContent = CTX.details;
$("ps").textContent = (CTX.paused ? "Paused · " : "") + CTX.state;
$("tmdb").onclick = e => { e.preventDefault(); post({ type: "open", url: CTX.tmdb_url }); };

function setPreview(url) {
  const img = $("pimg");
  if (!url) { img.removeAttribute("src"); return; }
  if (img.getAttribute("src") === url) return;
  img.classList.add("fade");
  const pre = new Image();
  pre.onload = () => { img.src = url; img.classList.remove("fade"); };
  pre.onerror = () => img.classList.remove("fade");
  pre.src = url;
}
setPreview(CTX.current || CTX.default);

// ---- elapsed timer (Discord shows elapsed time)
let pos = CTX.position || 0;
const fmt = s => { s = Math.max(0, Math.floor(s)); const h = Math.floor(s / 3600), m = Math.floor(s % 3600 / 60), x = s % 60;
  return (h ? h + ":" + String(m).padStart(2, "0") : m) + ":" + String(x).padStart(2, "0"); };
$("ptime").textContent = fmt(pos);
if (!CTX.paused && CTX.position != null) setInterval(() => { pos += 1; $("ptime").textContent = fmt(pos); }, 1000);
if (CTX.position == null) $("pt").style.display = "none";

// ---- scope selector
const scopes = isEpisode
  ? [["episode", "This episode"], ["season", "Season " + CTX.season], ["show", "Whole show"]]
  : [["show", CTX.kind === "Movie" ? "This movie" : "This show"]];
function renderScope() {
  $("scope").innerHTML = "";
  for (const [id, label] of scopes) {
    const b = document.createElement("button");
    b.textContent = label;
    b.className = id === scope ? "on" : "";
    if (applied[id]) { const d = document.createElement("span"); d.className = "dot"; d.title = "Custom artwork set"; b.appendChild(d); }
    b.onclick = () => { scope = id; renderScope(); updateButtons(); };
    $("scope").appendChild(b);
  }
}
if (scopes.length === 1) $("scopeBox").style.display = "none";
renderScope();

// ---- tabs & grid
function renderTabs() {
  $("tabs").innerHTML = "";
  (groups || []).forEach((g, i) => {
    const b = document.createElement("button");
    b.className = "tab" + (i === tab ? " on" : "");
    b.innerHTML = `<span></span><span class="n">${g.items.length}</span>`;
    b.firstChild.textContent = g.label;
    b.onclick = () => switchTab(i);
    $("tabs").appendChild(b);
  });
  if (groups) {
    const mark = document.createElement("span"); mark.className = "tabmark"; mark.setAttribute("aria-hidden", "true");
    $("tabs").appendChild(mark);
    placeTabMark(false);
  }
  if (!groups) {
    for (const w of [80, 70, 95, 84]) { const s = document.createElement("span"); s.className = "tab skel"; s.style.cssText = `width:${w}px;height:28px;display:inline-block`; $("tabs").appendChild(s); }
  }
}

// Switching tabs. Timeline, all on the click:
// underline slides to the new tab (220ms) · old covers leave at once · the new grid arrives as one piece,
// 10px from the side of travel (200ms) · covers already loaded ride in with it; the rest develop in as they land (320ms).
function placeTabMark(animate) {
  const mark = document.querySelector("#tabs .tabmark");
  const on = document.querySelector("#tabs .tab.on");
  if (!mark || !on) return;
  if (!animate) mark.style.transition = "none";
  mark.style.transform = `translateX(${on.offsetLeft}px) scaleX(${on.offsetWidth / 100})`;
  if (!animate) { mark.getBoundingClientRect(); mark.style.transition = ""; }
  mark.classList.add("ready");
}
function switchTab(i) {
  if (i === tab) return;
  const dir = i > tab ? 1 : -1;
  tab = i;
  document.querySelectorAll("#tabs .tab").forEach((b, j) => b.classList.toggle("on", j === i));
  placeTabMark(true);
  document.querySelector("#tabs .tab.on").scrollIntoView({ block: "nearest", inline: "nearest" });
  $("scroller").scrollTop = 0;
  renderGrid();
  const grid = $("grid");
  grid.getAnimations().forEach(a => a.cancel());
  grid.animate(calm() ? { opacity: [0, 1] } : { opacity: [0, 1], transform: [`translateX(${10 * dir}px)`, "none"] },
    { duration: 200, easing: EASE });
}
addEventListener("resize", () => placeTabMark(false));
document.documentElement.classList.add("js");

let gridAt = 0;
function renderGrid() {
  const grid = $("grid");
  grid.innerHTML = "";
  gridAt = performance.now();
  if (!groups) {
    grid.style.setProperty("--min", "220px"); grid.style.setProperty("--aspect", "16/9");
    for (let i = 0; i < 12; i++) { const t = document.createElement("div"); t.className = "tile skel"; grid.appendChild(t); }
    return;
  }
  const g = groups[tab];
  if (!g) { grid.innerHTML = `<div class="empty" style="grid-column:1/-1"><b>No artwork on TMDB yet</b>Paste an image URL on the right instead.</div>`; return; }
  const poster = g.aspect === "2/3";
  grid.style.setProperty("--min", poster ? "150px" : "220px");
  grid.style.setProperty("--aspect", g.aspect);
  g.items.forEach((it, i) => {
    const t = document.createElement("div");
    t.className = "tile" + (it.full === selected ? " sel" : "");
    t.tabIndex = 0;
    t.dataset.full = it.full;
    const img = document.createElement("img");
    img.loading = "lazy"; img.decoding = "async"; img.alt = "";
    img.onload = () => {
      img.classList.add("ok");
      // Cached covers land within the grid's own entrance and ride in with it; a second fade would only delay them.
      if (performance.now() - gridAt < 120) return;
      img.animate(calm() ? { opacity: [0, 1] } : { opacity: [0, 1], transform: ["scale(1.04)", "none"] },
        { duration: 320, easing: EASE });
    };
    img.src = it.thumb;
    t.appendChild(img);
    if (it.lang) { const c = document.createElement("span"); c.className = "chip"; c.textContent = it.lang.toUpperCase(); t.appendChild(c); }
    if (it.full === inUse) { const c = document.createElement("span"); c.className = "chip use"; c.textContent = "In use"; t.appendChild(c); }
    const check = document.createElement("span"); check.className = "check";
    check.innerHTML = '<svg aria-hidden="true" width="12" height="12" viewBox="0 0 12 12"><path d="M2.5 6.2l2.3 2.3 4.7-4.7" stroke="currentColor" stroke-width="1.8" fill="none" stroke-linecap="round" stroke-linejoin="round"/></svg>';
    t.appendChild(check);
    t.onclick = () => select(it.full);
    t.ondblclick = () => { select(it.full); apply(); };
    t.onkeydown = e => { if (e.key === " ") { e.preventDefault(); select(it.full); } };
    grid.appendChild(t);
  });
}

function select(url) {
  selected = url;
  document.querySelectorAll(".tile").forEach(t => t.classList.toggle("sel", t.dataset.full === url));
  $("url").classList.remove("bad");
  setPreview(url);
  updateButtons();
}

// The current scope in a sentence: "this episode", "season 1", "the whole show".
function scopeName() {
  const l = (scopes.find(s => s[0] === scope) || [, "this"])[1];
  return l === "Whole show" ? "the whole show" : l.charAt(0).toLowerCase() + l.slice(1);
}
// The selected cover in words ("Season 1, 3 of 8") and its thumbnail.
function describe(url) {
  for (const g of groups || []) {
    const i = g.items.findIndex(it => it.full === url);
    if (i >= 0) return { title: `${g.label}, ${i + 1} of ${g.items.length}`, thumb: g.items[i].thumb };
  }
  return { title: "Your own image", thumb: url };
}
// Swap a label with a short rise, only when its text actually changes.
function relabel(el, text) {
  if (el.textContent === text) return;
  const first = !el.dataset.set;
  el.dataset.set = "1"; el.textContent = text;
  if (!first)
    el.animate(calm() ? { opacity: [0, 1] } : { opacity: [0, 1], transform: ["translateY(4px)", "none"] }, { duration: 160, easing: EASE });
}
function updateButtons() {
  const own = applied[scope];
  $("apply").disabled = !selected || own === selected;
  if (selected) {
    const d = describe(selected);
    $("actImg").src = d.thumb;
    $("actTitle").textContent = d.title;
    $("actSub").textContent = own === selected ? `Already in use for ${scopeName()}` : `Selected for ${scopeName()}`;
  } else {
    $("actImg").removeAttribute("src");
    $("actTitle").textContent = "No cover selected";
    $("actSub").textContent = "Pick one on the left, or paste a link";
  }
  relabel($("apply"), own && own === selected ? `In use for ${scopeName()}` : `Use for ${scopeName()}`);
  $("actState").innerHTML = own ? `<span class="dot" aria-hidden="true"></span>Custom artwork set` : "Using TMDB’s artwork";
  $("reset").hidden = !own;
}

function toast(text) {
  $("toastText").textContent = text;
  $("toast").classList.add("show");
  clearTimeout(toast.t);
  toast.t = setTimeout(() => $("toast").classList.remove("show"), 2200);
}

// Move the "In use" chip in place. Rebuilding the grid here re-fades every poster.
// Timeline: old chip fades out (0ms, 120ms) · chosen cover seats (0ms, 260ms) ·
// new chip lands with the seat (40ms, 200ms) · toast rises (0ms, existing).
const EASE = getComputedStyle(document.documentElement).getPropertyValue("--ease-out").trim() || "ease-out";
const calm = () => matchMedia("(prefers-reduced-motion: reduce)").matches;
function markInUse(url, seat) {
  for (const old of document.querySelectorAll(".tile .chip.use")) {
    if (old.parentElement.dataset.full === url && !old.classList.contains("leaving")) continue;
    old.classList.add("leaving");
    old.getAnimations().forEach(a => a.cancel());
    old.animate({ opacity: [getComputedStyle(old).opacity, 0] }, { duration: 120, easing: EASE, fill: "forwards" })
      .finished.then(() => old.remove(), () => {});
  }
  const tile = [...document.querySelectorAll(".tile")].find(t => t.dataset.full === url);
  if (!tile || tile.querySelector(".chip.use:not(.leaving)")) return;
  const chip = document.createElement("span");
  chip.className = "chip use";
  chip.textContent = "In use";
  tile.insertBefore(chip, tile.querySelector(".check"));
  const still = calm();
  chip.animate(still ? { opacity: [0, 1] } : { opacity: [0, 1], transform: ["scale(0.9)", "none"] },
    { duration: 200, delay: 40, easing: EASE, fill: "backwards" });
  if (seat && !still) {
    tile.getAnimations().filter(a => a.id === "seat").forEach(a => a.cancel());
    tile.animate({ transform: ["scale(0.97)", "none"] }, { id: "seat", duration: 260, easing: EASE, composite: "add" });
  }
}

function apply() {
  if (!selected) return;
  post({ type: "apply", scope, url: selected });
  applied[scope] = selected; inUse = selected;
  renderScope(); markInUse(inUse, true); updateButtons();
  toast("Updated on Discord");
}

$("apply").onclick = apply;
$("reset").onclick = () => {
  if (!applied[scope]) return;
  post({ type: "reset", scope });
  delete applied[scope];
  const next = applied.episode || applied.season || applied.show || CTX.default;
  inUse = next; selected = null;
  document.querySelectorAll(".tile.sel").forEach(t => t.classList.remove("sel"));
  setPreview(next); renderScope(); markInUse(next, false); updateButtons();
  toast("Back to default artwork");
};
$("useUrl").onclick = () => {
  const v = $("url").value.trim();
  if (!/^https:\/\/\S+$/i.test(v)) {
    const field = $("url");
    field.classList.add("bad");
    if (!matchMedia("(prefers-reduced-motion: reduce)").matches) {
      field.getAnimations().forEach(a => a.cancel());
      field.animate(
        { transform: ["none", "translateX(-6px)", "translateX(5px)", "translateX(-3px)", "translateX(2px)", "none"] },
        { duration: 280, easing: getComputedStyle(document.documentElement).getPropertyValue("--ease-out").trim() || "ease-out" }
      );
    }
    return;
  }
  select(v);
};
$("url").onkeydown = e => { if (e.key === "Enter") $("useUrl").click(); };

document.addEventListener("keydown", e => {
  if (e.key === "Escape") post({ type: "close" });
  if (e.key === "Enter" && document.activeElement !== $("url")) apply();
});
// Drag the window by its empty top areas (macOS: there is no visible title bar).
for (const el of CTX.platform === "windows" ? [] : [$("drag"), $("aside")]) {
  el.addEventListener("mousedown", e => {
    if (e.button !== 0 || e.target.closest("button, a, input, .dcard, .tabs")) return;
    if (e.target === el || e.target.classList.contains("title") || e.target.classList.contains("subtitle")) post({ type: "drag" });
  });
}

// ---- data from the app
window.__options = data => {
  groups = data.groups.filter(g => g.items.length);
  if (!groups.length) groups = [];
  // Open on the tab containing the image in use, else the first.
  const idx = groups.findIndex(g => g.items.some(it => it.full === inUse));
  tab = idx >= 0 ? idx : 0;
  renderTabs(); renderGrid();
};
window.__error = msg => {
  groups = [];
  renderTabs();
  $("grid").innerHTML = `<div class="empty" style="grid-column:1/-1"><b>Couldn’t load artwork</b></div>`;
  $("grid").firstChild.appendChild(document.createTextNode(msg));
};

renderTabs(); renderGrid(); updateButtons();
post({ type: "ready" });
</script>
</body>
</html>
